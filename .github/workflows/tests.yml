name: Quality and Release Gates

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      run_external_smoke:
        description: Run the self-hosted external smoke acceptance gate
        type: boolean
        default: false
      run_browser_e2e:
        description: Run the disposable fake-executor browser acceptance gate
        type: boolean
        default: false
      external_smoke_cases:
        description: Comma-separated registered cases; default is the implemented Sobtop execution case
        type: string
        default: sobtop_ec
      require_execution_evidence:
        description: Require evidence that selected cases executed, not merely passed preflight
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  regression:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Verify installed dependency graph
        run: python -m pip check
      - name: Import package
        run: python -c "import willy"
      - name: Run deterministic pytest suite
        run: python -m pytest -q --junitxml=test-results/pytest.xml
      - name: Run deterministic LLM behavior evaluation
        run: python -m tests.llm_eval.run_eval
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python-version }}
          path: test-results/
          if-no-files-found: ignore

  quality:
    name: Quality contracts
    runs-on: ubuntu-latest
    needs: regression
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Verify bundled vendor integrity inventory
        run: python scripts/verify_vendor_manifest.py
      - name: Build and audit approved vendor release staging
        run: >-
          python scripts/build_release_staging.py --output /tmp/willy-release-staging &&
          python scripts/verify_vendor_manifest.py
          --artifact-root /tmp/willy-release-staging --require-release-ready
      - name: Verify generated test-case catalog is current
        run: python -m tests.tools.generate_test_case_catalog --output tests/reports/test_case_catalog.md && git diff --exit-code -- tests/reports/test_case_catalog.md

  browser-e2e:
    name: Browser E2E with fake executor
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_browser_e2e }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[e2e]"
      - name: Install Chromium runtime
        run: python -m playwright install --with-deps chromium
      - name: Run browser acceptance
        env:
          WILLY_E2E_REQUIRED: "1"
        run: python -m pytest -m e2e --run-e2e -q --junitxml=test-results/browser-e2e.xml
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore

  external-smoke:
    name: External smoke acceptance
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && inputs.run_external_smoke) ||
          vars.WILLY_ENABLE_EXTERNAL_SMOKE == 'true' }}
    needs: quality
    runs-on: [self-hosted, willy-external]
    timeout-minutes: 45
    env:
      WILLY_EXTERNAL_SMOKE_REQUIRED: "1"
      WILLY_EXTERNAL_SMOKE_FIXTURES: ${{ vars.WILLY_EXTERNAL_SMOKE_FIXTURES }}
      WILLY_EXTERNAL_SMOKE_CASES: ${{ inputs.external_smoke_cases || vars.WILLY_EXTERNAL_SMOKE_CASES || 'sobtop_ec' }}
      WILLY_EXTERNAL_SMOKE_EVIDENCE_DIR: ${{ github.workspace }}/test-results/external-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Run required external preflight and implemented executions
        run: python -m pytest -m external --run-external -q --junitxml=test-results/external-smoke.xml
      - name: Verify preflight evidence archive
        if: always()
        run: >-
          python -m willy.external_smoke
          --evidence-dir "$WILLY_EXTERNAL_SMOKE_EVIDENCE_DIR"
          --cases "$WILLY_EXTERNAL_SMOKE_CASES"
          --phase preflight
      - name: Verify required execution evidence
        if: >-
          ${{ always() &&
              ((github.event_name == 'workflow_dispatch' && inputs.require_execution_evidence) ||
               vars.WILLY_REQUIRE_EXTERNAL_EXECUTION_EVIDENCE == 'true') }}
        run: >-
          python -m willy.external_smoke
          --evidence-dir "$WILLY_EXTERNAL_SMOKE_EVIDENCE_DIR"
          --cases "$WILLY_EXTERNAL_SMOKE_CASES"
          --phase execution
          --require-execution
      - name: Upload external smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-smoke-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
