<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>Willy logo directions</title>
<style>
  :root { color-scheme: light; font-family: Inter, Arial, sans-serif; }
  body { margin: 0; padding: 32px; background: #f4f1ea; color: #17324d; }
  main { max-width: 960px; margin: auto; }
  h1 { font-size: 24px; margin: 0 0 24px; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  figure { margin: 0; padding: 18px; background: #fff; border: 1px solid #d8d2c4; border-radius: 8px; }
  img { display: block; width: 100%; aspect-ratio: 1; object-fit: contain; }
  figcaption { margin-top: 12px; font-size: 14px; color: #52606d; }
  @media (max-width: 700px) { body { padding: 16px; } .grid { grid-template-columns: 1fr; } }
</style>
<main>
  <h1>Willy logo directions</h1>
  <section class="grid">
    <figure><img src="willy-flow-orbit.svg" alt="Compact geometric W"><figcaption>Compact geometric W</figcaption></figure>
    <figure><img src="willy-signal-loop.svg" alt="Double-bond geometric W"><figcaption>Double-bond geometric W</figcaption></figure>
    <figure><img src="willy-molecule-route.svg" alt="Node-built geometric W"><figcaption>Node-built geometric W</figcaption></figure>
    <figure><img src="willy-continuum.svg" alt="Modular geometric W"><figcaption>Modular geometric W</figcaption></figure>
  </section>
</main>
