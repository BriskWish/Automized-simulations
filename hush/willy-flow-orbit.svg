<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Compact geometric W mark</title>
  <desc id="desc">Five molecular nodes connected by straight bonds form a compact geometric W.</desc>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M90 132 166 370 256 194 346 370 422 132" stroke="#17324D" stroke-width="19"/>
    <path d="M90 132 256 194 422 132" stroke="#2A9D8F" stroke-width="10" opacity=".78"/>
    <path d="M166 370h180" stroke="#E9C46A" stroke-width="10" opacity=".82"/>
  </g>
  <g stroke="#F4F1EA" stroke-width="9">
    <circle cx="90" cy="132" r="30" fill="#17324D"/>
    <circle cx="166" cy="370" r="33" fill="#2A9D8F"/>
    <circle cx="256" cy="194" r="35" fill="#E76F51"/>
    <circle cx="346" cy="370" r="33" fill="#2A9D8F"/>
    <circle cx="422" cy="132" r="30" fill="#17324D"/>
  </g>
  <circle cx="256" cy="194" r="12" fill="#F4F1EA"/>
  <circle cx="90" cy="132" r="10" fill="#E9C46A"/>
  <circle cx="422" cy="132" r="10" fill="#E9C46A"/>
</svg>
