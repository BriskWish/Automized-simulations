[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "willy"
version = "0.5.0"
description = "AI-driven MD simulation automation pipeline"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42",
    "fastapi>=0.115",
    "httpx>=0.27",
    "openai",
    "py3Dmol",
    "scikit-learn",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "tomli>=2.0; python_version < '3.11'",
]
dev = [
    "pytest>=8",
    "tomli>=2.0; python_version < '3.11'",
]
e2e = [
    "pytest>=8",
    "playwright>=1.48",
    "tomli>=2.0; python_version < '3.11'",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "unit: isolated deterministic tests without external-process execution",
    "contract: cross-module schema, artifact, and protocol contract tests",
    "integration: in-process integration tests using controlled substitutes",
    "external: real external-tool smoke tests; require --run-external",
    "llm_connection: real LLM connectivity test; requires --run-llm-connection",
    "llm_eval: deterministic LLM behavior evaluation cases",
    "e2e: browser acceptance tests; require --run-e2e and a Playwright browser runtime",
    "gateway_acceptance: offline managed-gateway acceptance using ASGI and scripted fake upstreams",
    "slow: tests unsuitable for the normal quick-feedback loop",
]
